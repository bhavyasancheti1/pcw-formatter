<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCW Formatter</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl">
    <h1 class="text-2xl font-bold mb-6 text-center">Generate PCW Excel</h1>

    <form id="pcwForm" enctype="multipart/form-data">
      <div class="mb-4">
        <label for="gpt_output" class="block font-semibold mb-1">GPT Output Excel</label>
        <input type="file" id="gpt_output" name="gpt_output" accept=".xlsx" class="w-full border rounded p-2" required />
      </div>
      <div class="mb-4">
        <label for="pcw_template" class="block font-semibold mb-1">PCW Template Excel</label>
        <input type="file" id="pcw_template" name="pcw_template" accept=".xlsx" class="w-full border rounded p-2" required />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Generate & Upload to Drive</button>
    </form>

    <div id="responseSection" class="mt-6 hidden">
      <p class="text-green-600 font-semibold" id="statusMsg"></p>
      <div class="mt-2">
        <a id="viewLink" href="#" target="_blank" class="text-blue-500 underline mr-4">View on Drive</a>
        <a id="downloadLink" href="#" target="_blank" class="text-blue-500 underline">Download File</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('pcwForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('gpt_output', document.getElementById('gpt_output').files[0]);
      formData.append('pcw_template', document.getElementById('pcw_template').files[0]);

      const response = await fetch('https://pcw-formatter-2.onrender.com/generate-pcw/', {
        method: 'POST',
        body: formData,
      });

      if (response.ok) {
        const result = await response.json();
        document.getElementById('responseSection').classList.remove('hidden');
        document.getElementById('statusMsg').textContent = result.message;
        document.getElementById('viewLink').href = result.view_link;
        document.getElementById('downloadLink').href = result.download_link;
      } else {
        alert('Failed to generate PCW file.');
      }
    });
  </script>
</body>
</html>
